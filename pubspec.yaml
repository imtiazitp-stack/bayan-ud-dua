name: bayan_ud_dua
description: "Bayan-udh-Dua — a collection of authentic duas, azkar and istighfar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36          # audio playback (works well on iOS + Android)
  shared_preferences: ^2.2.2   # favorites + last-read, stored on-device
  google_fonts: ^6.2.1         # for a proper Arabic-friendly font (e.g. Amiri/Lateef)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/duas.json
    - assets/data/emotions.json
    - assets/data/situations.json
    - assets/audio/
