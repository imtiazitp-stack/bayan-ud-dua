name: bayan_ud_dua
description: "Bayan-udh-Dua — a collection of authentic duas, azkar and istighfar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36          # audio playback (works well on iOS + Android)
  shared_preferences: ^2.2.2   # favorites + last-read, stored on-device
  google_fonts: ^6.2.1         # for a proper Arabic-friendly font (e.g. Amiri/Lateef)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FBF9E2"
  adaptive_icon_foreground: "assets/icon/app_icon_source.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/duas.json
    - assets/data/emotions.json
    - assets/data/situations.json
    - assets/audio/
    - assets/images/
